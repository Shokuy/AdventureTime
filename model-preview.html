<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model Preview</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #1c1420; overflow: hidden; font: 12px/1.3 system-ui, sans-serif; color: #f3e9dc; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #ui { position: fixed; top: 8px; left: 8px; background: rgba(20, 12, 24, 0.82); padding: 8px 10px; border-radius: 8px; max-width: 330px; }
      #ui .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 3px 0; }
      #ui button { background: #3b2a44; color: #f3e9dc; border: 1px solid #6b4e78; border-radius: 4px; padding: 2px 6px; cursor: pointer; font: inherit; }
      #ui button.on { background: #8a4fa0; }
      #ui select { background: #2b1f33; color: #f3e9dc; border: 1px solid #6b4e78; border-radius: 4px; font: inherit; }
      #ui label { opacity: 0.8; min-width: 46px; }
      #status { position: fixed; bottom: 8px; left: 8px; background: rgba(20, 12, 24, 0.75); padding: 4px 8px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui"></div>
    <div id="status"></div>
    <script type="module" src="/src/three/models/preview.ts"></script>
  </body>
</html>
